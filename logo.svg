<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Morpion Arena">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d2547"/>
      <stop offset="1" stop-color="#14111f"/>
    </linearGradient>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa36c"/>
      <stop offset="1" stop-color="#ff5f86"/>
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf0e0"/>
      <stop offset="1" stop-color="#28b8a6"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Grille du morpion, discrète -->
  <g stroke="#ffffff" stroke-opacity="0.13" stroke-width="14" stroke-linecap="round">
    <path d="M203 92 V420 M309 92 V420 M92 203 H420 M92 309 H420"/>
  </g>

  <!-- X rose corail -->
  <path d="M112 112 L262 262 M262 112 L112 262" stroke="url(#gx)" stroke-width="58" stroke-linecap="round" fill="none"/>

  <!-- O turquoise -->
  <circle cx="326" cy="326" r="76" stroke="url(#go)" stroke-width="54" fill="none"/>
</svg>
